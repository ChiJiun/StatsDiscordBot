name: Discord report PDF tests

on:
  pull_request:
    paths:
      - "pdf_embed.py"
      - "report_generator.py"
      - "tests/**"
      - ".github/workflows/report-pdf-tests.yml"
  push:
    branches: [main, develop]
    paths:
      - "pdf_embed.py"
      - "report_generator.py"
      - "tests/**"
      - ".github/workflows/report-pdf-tests.yml"

permissions:
  contents: read

jobs:
  report-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "Markdown>=3.4,<4" "python-docx>=0.8.11,<1"
      - run: python -m compileall -q pdf_embed.py report_generator.py
      - run: python -m unittest discover -s tests -v
